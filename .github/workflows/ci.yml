name: CI

# macOS minutes are expensive, so the Mac build doesn't run on every push to a
# pull request:
#   - pull_request: quick checks only (the website). Coding agents and people
#     run the Mac tests locally while they work.
#   - merge_group: the full check, including the Mac build and tests, runs once
#     when a pull request enters the merge queue. Nothing reaches main untested.
#   - workflow_dispatch: run the full check on any branch from the Actions tab.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

# A newer push to the same pull request or branch replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.filter.outputs.mac }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check which apps changed
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # Without a base commit to compare against (a manual run), check everything.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "mac=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BASE" HEAD)"
          echo "Changed files:"
          echo "$changed"

          # Changes to CI itself re-check both apps.
          matches() { grep -qE "$1" <<< "$changed" && echo true || echo false; }
          echo "mac=$(matches '^(apps/mac/|scripts/|\.github/)')" >> "$GITHUB_OUTPUT"
          echo "web=$(matches '^(apps/web/|\.github/)')" >> "$GITHUB_OUTPUT"

  mac:
    name: Mac app
    needs: changes
    # Only in the merge queue or when run manually; see the note at the top.
    if: needs.changes.outputs.mac == 'true' && github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Install the Metal Toolchain
        # MLX compiles its GPU kernels with it, and the runner image doesn't include it.
        run: |
          xcodebuild -showComponent MetalToolchain | grep -q "Status: installed" \
            || xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: spm-${{ hashFiles('apps/mac/LocalBolo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      # -skipPackagePluginValidation trusts mlx-swift's build plugin, like
      # clicking "Trust & Enable" in Xcode.
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project LocalBolo.xcodeproj \
            -scheme "LocalBolo Dev" \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/UnitTests.xcresult" \
            -skipPackagePluginValidation \
            -quiet

      - name: Build the production app
        # Unsigned: the Developer ID certificate is only needed when releasing.
        # ARCHS=arm64 also applies to the Swift packages, which would otherwise
        # be built for Intel too, although the app only runs on Apple Silicon.
        run: |
          xcodebuild build \
            -project LocalBolo.xcodeproj \
            -scheme LocalBolo \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            -quiet \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: ${{ runner.temp }}/UnitTests.xcresult
          if-no-files-found: ignore

  web:
    name: Website
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  # The single check that branch protection and the merge queue require. Skipped
  # jobs (an app that didn't change, or the Mac build on a pull request) count
  # as passing here.
  ci-passed:
    name: CI passed
    needs: [changes, mac, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              exit 1
            fi
          done
